[package]
name = "neko-dataplane"
version = "0.1.0"
edition = "2021"
description = "Neko media dataplane: GStreamer capture + WebRTC, driven by the Go control plane over a Unix socket"
license = "Apache-2.0"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
futures-core = "0.3"
futures-util = "0.3"
webrtc = "=0.14.0"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
bytes = "1.12.1"
anyhow = "1.0.104"

[build-dependencies]
tonic-build = "0.13"

[profile.release]
strip = "symbols"
