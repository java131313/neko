// Neko dataplane gRPC API.
//
// The dataplane (Rust, neko-dataplane) owns the media path: GStreamer
// capture/encoding and WebRTC peer connections. The control plane (Go,
// neko server) owns signaling, sessions and X11 input injection, and
// drives the dataplane over a Unix domain socket.
//
// Generated code is checked in on both sides:
//   Go:   protoc-gen-go + protoc-gen-go-grpc -> server/internal/webrtcp/pb
//   Rust: tonic-build -> dataplane/src/pb.rs (via build.rs)
syntax = "proto3";

package neko.dataplane.v1;

option go_package = "github.com/m1k1o/neko/server/internal/webrtcp/pb";

// Control events and data-channel messages pushed from the dataplane to
// the control plane. A single long-lived stream; the control plane matches
// events to local peers by session_id.
service Dataplane {
  // Pushes the resolved WebRTC configuration once, at startup. Must be the
  // first RPC. The control plane remains the single source of truth for
  // configuration parsing (env vars, config file, v2 fallbacks).
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);

  // Creates a peer and returns the SDP offer generated by the server side
  // (the control plane relays it to the browser as SIGNAL_PROVIDE).
  rpc CreatePeer(CreatePeerRequest) returns (CreatePeerResponse);

  // Renegotiation and ICE restart flows, mirroring types.WebRTCPeer.
  rpc SetRemoteDescription(SetRemoteDescriptionRequest) returns (SetRemoteDescriptionResponse);
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse);
  rpc CreateAnswer(CreateAnswerRequest) returns (CreateAnswerResponse);
  rpc AddIceCandidate(AddIceCandidateRequest) returns (AddIceCandidateResponse);

  rpc DestroyPeer(DestroyPeerRequest) returns (DestroyPeerResponse);

  rpc SetPaused(SetPausedRequest) returns (SetPausedResponse);
  rpc SetVideo(SetVideoRequest) returns (SetVideoResponse);
  rpc SetAudio(SetAudioRequest) returns (SetAudioResponse);

  // Writes a data-channel message to one peer's "data" channel.
  // Empty session_id broadcasts to all peers. Used for cursor
  // position/image and pong replies; payload format is the unchanged
  // neko binary protocol (see server/internal/webrtc/payload).
  rpc SendData(SendDataRequest) returns (SendDataResponse);

  // Event stream (ICE candidates, connection states, data-channel
  // lifecycle, inbound data-channel messages i.e. user input events).
  rpc Events(EventsRequest) returns (stream Event);
}

message Empty {}

message ConfigureRequest {
  WebRtcConfig config = 1;
  // Capture pipelines assembled by the control plane (display/device
  // placeholders already substituted). Empty strings mean "no media" —
  // peers are then negotiated without samples flowing (useful for local
  // smoke tests).
  CaptureConfig capture = 2;
}

message CaptureConfig {
  string display = 1;
  string audio_device = 2;
  // Full GStreamer parse strings, each containing `appsink name=appsink`.
  string video_pipeline = 3;
  string audio_pipeline = 4;
  // Codec names, matching the SDP registration: "vp8", "h264", "opus", ...
  string video_codec = 5;
  string audio_codec = 6;
}

message ConfigureResponse {}

message WebRtcConfig {
  bool ice_lite = 1;
  bool ice_trickle = 2;
  // ICE servers for the dataplane's own agent (backend set). The frontend
  // set is served to browsers by the control plane and not needed here.
  repeated IceServer ice_servers_backend = 3;
  uint32 ephemeral_min = 4;
  uint32 ephemeral_max = 5;
  int32 tcp_mux = 6;
  int32 udp_mux = 7;
  repeated string nat1to1_ips = 8;
}

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message CreatePeerRequest {
  string session_id = 1;
}

message CreatePeerResponse {
  // SDP offer generated by the server side.
  string sdp = 1;
}

message SetRemoteDescriptionRequest {
  string session_id = 1;
  // "offer" or "answer"
  string type = 2;
  string sdp = 3;
}

message SetRemoteDescriptionResponse {}

message CreateOfferRequest {
  string session_id = 1;
  bool ice_restart = 2;
}

message CreateOfferResponse {
  string sdp = 1;
}

message CreateAnswerRequest {
  string session_id = 1;
}

message CreateAnswerResponse {
  string sdp = 1;
}

message IceCandidateInit {
  string candidate = 1;
  optional string sdp_mid = 2;
  optional uint32 sdp_mline_index = 3;
  optional string username_fragment = 4;
}

message AddIceCandidateRequest {
  string session_id = 1;
  IceCandidateInit candidate = 2;
}

message AddIceCandidateResponse {}

message DestroyPeerRequest {
  string session_id = 1;
}

message DestroyPeerResponse {}

message SetPausedRequest {
  string session_id = 1;
  bool paused = 2;
}

message SetPausedResponse {}

message StreamSelector {
  string id = 1;
  string type = 2;
}

message SetVideoRequest {
  string session_id = 1;
  optional bool disabled = 2;
  optional StreamSelector selector = 3;
  optional bool auto = 4;
}

message SetVideoResponse {}

message SetAudioRequest {
  string session_id = 1;
  optional bool disabled = 2;
}

message SetAudioResponse {}

message SendDataRequest {
  string session_id = 1;
  bytes data = 2;
}

message SendDataResponse {}

message EventsRequest {}

message Event {
  oneof kind {
    IceCandidateEvent ice_candidate = 1;
    ConnectionStateEvent connection_state = 2;
    DataChannelEvent data_channel = 3;
    DataMessage data_message = 4;
  }
}

message IceCandidateEvent {
  string session_id = 1;
  IceCandidateInit candidate = 2;
}

// state is one of: new, connecting, connected, disconnected, failed, closed
message ConnectionStateEvent {
  string session_id = 1;
  string state = 2;
}

// open=true when the peer's "data" channel opened, false when closed.
message DataChannelEvent {
  string session_id = 1;
  bool open = 2;
}

// An inbound data-channel message (user input events in the neko binary
// protocol). Forwarded opaquely to the control plane, which keeps the
// parsing and X11 injection logic.
message DataMessage {
  string session_id = 1;
  bytes data = 2;
}
