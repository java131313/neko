name: neko-rs e2e image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push neko-rs test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: neko-rs/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/java131313/neko-rs:test
          cache-from: type=gha,scope=neko-rs-image
          cache-to: type=gha,mode=max,scope=neko-rs-image
