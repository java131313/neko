name: zed-rs image

# Rust 版 zed 镜像(neko-rs 协议栈,无 Go server):
# base-rs(neko-rs/Dockerfile target=base)+ apps/zed/Dockerfile.rust,
# 双架构推 ghcr,产物 tag zed-rs:<branch>。功能与 Go 版 zed 一致。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base-rs:
    name: Build neko-rs base image
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.branch.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize branch name for Docker tag
        id: branch
        run: |
          TAG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Branch tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-rs image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: neko-rs/Dockerfile
          target: base
          push: true
          tags: ghcr.io/${{ github.repository }}/base-rs:${{ steps.branch.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=neko-rs-image
          cache-to: type=gha,mode=max,scope=neko-rs-image

  build-app:
    name: Build zed-rs Image
    runs-on: ubuntu-latest
    needs: build-base-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push zed-rs image
        uses: docker/build-push-action@v6
        with:
          context: apps/zed
          file: apps/zed/Dockerfile.rust
          push: true
          tags: ghcr.io/${{ github.repository }}/zed-rs:${{ needs.build-base-rs.outputs.branch_tag }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/base-rs:${{ needs.build-base-rs.outputs.branch_tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
