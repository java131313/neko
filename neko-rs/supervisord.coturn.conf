[program:coturn]
command=/bin/sh -c 'NEKO_TURN_USERNAME="$${NEKO_TURN_USERNAME:-neko}" NEKO_TURN_PASSWORD="$${NEKO_TURN_PASSWORD:-neko}" exec /usr/bin/turnserver -c /etc/neko/turnserver.conf'
priority=400
autorestart=true
user=neko
stdout_logfile=/var/log/neko/coturn.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
