[package]
name = "neko-rs"
version = "0.1.0"
edition = "2021"
description = "Neko server in Rust: HTTP/WebSocket control plane + GStreamer capture + WebRTC, one process. Replaces server/ (Go); the client stays unchanged."
license = "Apache-2.0"

[dependencies]
# async runtime + http/ws server
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
hyper = "1"

# serialization + protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# media
gstreamer = "0.25"
gstreamer-app = "0.25"
webrtc = "=0.14.0"

# desktop control (X11, pure rust)
x11rb = { version = "0.13", features = ["xtest", "randr", "xfixes", "xkb", "xinput", "image"] }

# misc
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1"
thiserror = "2"
futures-util = "0.3"

# neko-webshell binary (terminal ws->pty bridge, replaces apps/*/webshell.py)
tokio-tungstenite = "0.30"
nix = { version = "0.31", features = ["fs", "process", "signal", "term"] }
libc = "0.2"

[[bin]]
name = "neko-rs"
path = "src/main.rs"

[[bin]]
name = "neko-webshell"
path = "src/bin/webshell.rs"

[profile.release]
strip = "symbols"
