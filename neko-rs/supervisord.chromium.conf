[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
# profile-sync wraps chromium: without NEKO_CHROMIUM_STATE_URL it execs
# straight through; with it, profile snapshots + browsing log go to Postgres
command=/usr/bin/neko-profile-sync /usr/bin/chromium --no-sandbox --window-position=0,0 --display=%(ENV_DISPLAY)s "--user-data-dir=/home/neko/.config/chromium" --no-first-run --start-maximized --bwsi --force-dark-mode --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
