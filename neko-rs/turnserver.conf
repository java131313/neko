# coturn embedded in the neko-rs e2e/all-in-one image.
#
# SealOS / any no-sysctl deployment: expose only
#   8080 (tcp, HTTP/WS), 7681 (tcp, webshell),
#   3478 (udp+tcp, TURN), 53400-53420 (udp, TURN relay range)
# and point NEKO_TURN_HOST at the public address. Both browser and
# neko-rs allocate relay candidates from this server, so neither side
# needs pinned ephemeral ports.
#
# user= uses coturn >=4.6 environment expansion ($(VAR) from the process
# environment); trixie ships 4.6.2+.

listening-port=3478
# TLS stays off in the all-in-one image: secure the web side with the
# platform's edge TLS (SealOS gives the app a https/wss domain), and the
# TURN traffic rides udp/tcp on 3478. Enable tls-listening-port in a
# custom config when a deployment needs DTLS/TURNS.
fingerprint
lt-cred-mech
realm=neko

user=$(NEKO_TURN_USERNAME):$(NEKO_TURN_PASSWORD)

min-port=53400
max-port=53420

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
pidfile=/run/neko/turnserver.pid
